# Entorno LOCAL de pruebas, sin registro público.
project_id = "micatalogo-test"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
# CLI 2.122.0 ya no acepta 16 para el stack. Las pruebas SQL independientes usan 16.
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
jwt_expiry = 3600
minimum_password_length = 12
[auth.email]
# En esta CLI desactivar este valor también desactiva el proveedor de email.
# El registro sigue cerrado por auth.enable_signup=false y max_users=1 en SQL.
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "12MiB"
[edge_runtime]
enabled = true
policy = "per_worker"
[analytics]
enabled = false
[functions.catalog-api]
verify_jwt = false
