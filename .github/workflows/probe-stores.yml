name: Probe stores (temporal)
on:
  push:
    branches: [claude/oye-nui2ws]
    paths: [.github/probe/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node .github/probe/probe.mjs
