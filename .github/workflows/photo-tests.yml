name: Photo source tests (temporal)
on:
  push:
    branches: [claude/oye-nui2ws]
    paths: [ios/**, .github/workflows/photo-tests.yml]
permissions:
  contents: read
concurrency:
  group: photo-tests
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Run photo tests
        env:
          TEST_RUNNER_PHOTO_LIVE: "1"
        run: |
          python3 scripts/configure-cloud.py
          (cd ios && xcodegen generate)
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; ds=[d for v in json.load(sys.stdin)["devices"].values() for d in v if "iPhone" in d["name"]]; print(ds[0]["udid"])')
          set -o pipefail
          xcodebuild -project ios/MiCatalogo.xcodeproj -scheme MiCatalogo -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/PhotoTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -only-testing:MiCatalogoTests/PhotoSourcesTests test 2>&1 | tee photo-tests.log | grep -E "error:|LIVE|Test Case|Executed|warning: .*Photo" || true
          grep -q "TEST SUCCEEDED" photo-tests.log
