name: MiCatalogo
options:
  bundleIdPrefix: com.micatalogo
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: es
targets:
  MiCatalogo:
    type: application
    platform: iOS
    sources:
    - FashionCatalog
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Mi Catálogo
        UIDesignRequiresCompatibility: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
        - CFBundleURLSchemes:
          - micatalogo
          CFBundleURLName: com.micatalogo.moda.auth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.micatalogo.moda
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
    - package: Supabase
      product: Supabase
    configFiles:
      Debug: Config/Cloud.xcconfig
      Release: Config/Cloud.xcconfig
  MiCatalogoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - FashionCatalogTests
    dependencies:
    - target: MiCatalogo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.micatalogo.moda.tests
  MiCatalogoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - FashionCatalogUITests
    dependencies:
    - target: MiCatalogo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.micatalogo.moda.uitests
schemes:
  MiCatalogo:
    build:
      targets:
        MiCatalogo: all
        MiCatalogoTests:
        - test
        MiCatalogoUITests:
        - test
    test:
      targets:
      - MiCatalogoTests
      - MiCatalogoUITests
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.5
